[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "manux"
authors = [
  { name = "Emmanuel Roux" },
  { email = "15956441+fesaille@users.noreply.github.com" },
]
dynamic = ["version"]
dependencies = [
  "sphinx-autobuild @ git+https://github.com/e-roux/sphinx-autobuild@e6c59cb3652578c6d4d62b8ddb7e01d283e7d0ac",
  "sphinx",
  "furo",
  "myst-parser",
  "sphinx_design",
  "sphinx_tippy",
  "sphinx-togglebutton",
  "sphinxcontrib-svgbob>=0.2.1",
]
description = ""
classifiers = [
  "Programming Language :: Python :: 3.10",
]
requires-python = ">= 3.10"

[project.optional-dependencies]
test = ["coverage[toml]>=7", "pytest>=7"]
lint = ["ruff", "yamllint"]

[tool.coverage.run]
command_line = "-m pytest --junitxml=report.xml"
source = ["src"]
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "pragma: no cover"]
omit = ["src/manux/__version__.py"]

[tool.mypy]
mypy_path = "stubs"
files = "src"
pretty = true
show_column_numbers = true
show_error_codes = true
warn_return_any = true

[tool.ruff]
cache-dir = "/Users/manu/development/github.com/e-roux/e-roux.github.io/wt/sphinx/.cache/ruff"

[tool.pytest.ini_options]
addopts = ["--ignore=setup.py", "--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["ignore:the imp module is deprecated"]
markers = ["e2e: tests that require an external connection"]
testpaths = [
  "/Users/manu/development/github.com/e-roux/e-roux.github.io/wt/sphinx/test",
]
cache_dir = ".cache/pytest"
