<div class="card h-100">
  <div class="card-header position-relative">
    {{if .Get "youtube"}}
      <iframe
        class="card-img-top"
        src="https://www.youtube.com/embed/{{- .Get "youtube" -}}/"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    {{end}}
    {{if .Get "coursera"}}
      <video width="100%" controls><source src="{{ .Get "coursera" }}" ></video>
    {{end}}
    {{if .Get "img"}}
      <img src="{{ .Site.BaseURL }}/img/courses/{{ .Get "img" }}" alt="{{ .Get "name" }}"
        class="img-course card-img-top img-fluid"/>
      <div
        class="d-none opacity-75 card-img-overlay d-flex background-transparent bg-secondary"
        style="--bs-bg-opacity: .3;">
        <a href="{{ .Get "link" }}" class="d-flex" target="_blank">
          <img
            src="{{ .Site.BaseURL }}/img/courses/link.svg"
            class="align-self-center mx-auto w-50 blue text-white"
            />
          </a>
      </div>
    {{end}}
  </div>
  <div class="card-body">
    <h5 class="card-title">{{ .Get "name"}}</h5>
    <p class="card-text"> {{ .Get "desc"}}</p>
  </div>
  <div class="d-inline-flex flex-row align-items-center justify-content-between card-footer bg-transparent border-0 px-1" style="max-height: 50px;">

    <div style="max-height: inherit;">
      {{if .Get "lecture-from"}}
      <img style="max-height: inherit;" src="{{ .Site.BaseURL }}/img/courses/{{ .Get "lecture-from" }}"/>
      {{end}}
    </div>

    {{if .Get "certificate"}}
    <div class="flex-shrink-0 d-flex">
      <a href={{ .Get "certificate" }} target="_blank">
        <img src="{{ .Site.BaseURL }}/img/courses/certificate.svg">
      </a>
    </div>
    {{end}}

  </div>
</div>
