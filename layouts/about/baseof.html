<!DOCTYPE html>
<html lang="{{ .Lang }}" itemscope itemtype="http://schema.org/WebPage">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ partial "nav.html" . }}
    {{ block "header" . }}{{ partial "header.html" . }}{{ end }}
    <div style="position: -webkit-fixed;;position:fixed;top:80px;left:0;">
      {{ partial "about/sidebar.html" . }}
    </div>
    <div class="container" style="position:relative;">
      <div class="row">
        <div class="col-12">
          {{ block "main" . }}{{ end }}
        </div>
      </div>
    </div>
    {{ partial "footer.html" . }}
    {{ block "footer" . }}{{ end }}
    <script type="text/javascript">
      import("/js/cards.js").then((module) => {
              document.addEventListener("DOMContentLoaded", module.groupCard);
              document.addEventListener("DOMContentLoaded", module.displayLinkHoverImg);
              document.addEventListener("DOMContentLoaded", () => console.log("YO"));}
            );

    </script>
  </body>
</html>
