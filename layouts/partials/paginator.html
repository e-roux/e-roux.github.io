{{ if or (.Paginator.HasPrev) (.Paginator.HasNext) }}
<nav aria-label="navigation">

  <ul class="pagination justify-content-center">
    <li class="page-item">
      <a class="page-link" href="{{ .Permalink }}page/{{ .Paginator.First.PageNumber }}/">&larr;</a>
    </li>

    {{ range .Paginator.Pagers }}
    <li class="page-item">
      <a class="page-link" href="{{ .URL }}">{{ .PageNumber }}</a>
    </li>
    {{ end }}

    <li class="page-item">
      <a class="page-link" href="{{ .Permalink }}page/{{ .Paginator.Last.PageNumber }}/">&rarr;</a>
    </li>
  </ul>
</nav>
{{ end }}
