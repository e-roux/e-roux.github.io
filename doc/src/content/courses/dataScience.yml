name: 'Data Science'
content:
  - name: 'What is Data Science?'
    desc: 'Get an overview of what data science is today'
    link: 'https://www.coursera.org/learn/what-is-datascience'
    img: 'what-is-datascience.jpeg'
    certificate: 'https://coursera.org/share/e23f56765c80c29372699fd1cbfba7ca'
    lecture-from: 'coursera.jpg'

  - name: 'Data Science Methodology'
    desc: 'Methodology that can be used within data science, to ensure that the data used in problem solving is relevant and properly manipulated to address the question at hand'
    link: 'https://www.coursera.org/learn/data-science-methodology'
    img: 'data-science-methodology.jpeg'
    certificate: 'https://coursera.org/share/4540ef8beb48cfbd058cea46eb905565'
    lecture-from: 'coursera.jpg'

  - name: 'Tools for Data Science'
    desc: 'Jupyter Notebooks, JupyterLab, RStudio IDE, Git, GitHub, and Watson Studio'
    link: 'https://www.coursera.org/learn/open-source-tools-for-data-science'
    img: 'open-source-tools-for-data-science.jpeg'
    certificate: 'https://coursera.org/share/64db4948cc3713e9ac1ba58c27be333a'
    lecture-from: 'coursera.jpg'

  - name: 'Data Analysis with Python'
    desc: 'Learn how to analyze data using Python'
    link: 'https://www.coursera.org/learn/data-analysis-with-python'
    img: 'data-analysis-with-python.jpeg'
    certificate: 'https://coursera.org/share/080b4f9c95e8a8c7f43684b173c3e25a'
    lecture-from: 'coursera.jpg'

  - name: 'Databases and SQL for Data Science with Python'
    desc: 'The purpose of this course is to introduce relational database concepts and help you learn and apply foundational knowledge of the SQL language'
    link: 'https://www.coursera.org/learn/sql-data-science'
    img: 'sql-data-science.jpeg'
    certificate: 'https://coursera.org/share/cf549f03ccd7b73dc0452c27c573d1cc'
    lecture-from: 'coursera.jpg'

  - name: 'Python for Data Science, AI & Development'
    desc: 'Python fundamentals, including data structures and data analysis'
    link: 'https://www.coursera.org/learn/python-for-applied-data-science-ai'
    img: 'python-for-applied-data-science-ai.jpeg'
    certificate: 'https://coursera.org/share/a3c96a76d7f6bd57a61a7b114cb8f075'
    lecture-from: 'coursera.jpg'

  - name: 'Data Visualization with Python'
    desc: 'How to take data that at first glance has little meaning and present that data in a form that makes sense to people'
    link: 'https://www.coursera.org/learn/python-for-data-visualization'
    img: 'python-for-data-visualization.jpeg'
    certificate: 'https://coursera.org/share/72467a60ce86a4889cce68912bf7ef2a'
    lecture-from: 'coursera.jpg'

  - name: 'Machine Learning with Python'
    desc: 'This course dives into the basics of machine learning using an approachable, and well-known programming language, Python. '
    link: 'https://www.coursera.org/learn/machine-learning-with-python'
    img: 'machine-learning-with-python.jpeg'
    certificate: 'https://coursera.org/share/97b033051e461a90987cbca160723ebb'
    lecture-from: 'coursera.jpg'

  - name: 'Fundamentals of Scalable Data Science'
    desc: 'Fundamentals of Apache Spark using python and pyspark'
    link: 'https://www.coursera.org/learn/ds'
    img: 'coursera-fundametal-of-data-science-01.jpg'
    certificate: 'https://coursera.org/share/65767feff795952e9fca41008f778af9'
    lecture-from: 'coursera.jpg'

  - name: 'Advanced Machine Learning and Signal Processing'
    desc: 'Fundamentals of Linear Algebra and introduction to the most popular Machine Learning Frameworks for python Scikit-Learn and SparkML'
    link: 'https://www.coursera.org/learn/advanced-machine-learning-signal-processing'
    img: 'advanced-machine-learning-signal-processing.jpeg'
    certificate: 'https://coursera.org/share/08b0a940b1ea5c21b68ebe1521e2f413'
    lecture-from: 'coursera.jpg'

  - name: 'Neural Network and Deep Learning'
    desc: 'Foundational concept of neural networks and deep learning'
    link: 'https://www.coursera.org/learn/neural-networks-deep-learning'
    img: 'neural-networks-deep-learning.jpeg'
    certificate: 'https://coursera.org/share/97c85c74b67399ff9067f6e4c2b9f78a'
    lecture-from: 'coursera.jpg'
