    desc: SOLID principles, implementing creational, structural, and behavioral design patterns in TypeScript, and using Dependency Injection to create flexible and testable application structures.
    link: https://www.oreilly.com/videos/design-patterns-in/9781789347951
    img: design-patterns.png
    certificate: https://www.credly.com/badges/09f37b38-75c3-4051-b560-3699b7c07a3d
    lecture-from: oreilly.png

  - name: 'Working with React and Go'
    desc: 'React components, hooks, JSON and as GraphQL Go requests on the back end'
    img: 'react.go.jpg'
    link: https://www.udemy.com/course/working-with-react-and-go-golang/
    lecture-from: udemy.png
    ongoing: true
