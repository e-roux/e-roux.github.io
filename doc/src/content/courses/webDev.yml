    lecture-from: 'john_hopkins.png'

  - name: 'Ruby on Rails: An Introduction'
    desc: 'How to build web applications with the Ruby on Rails web application framework, which is geared towards rapid prototyping'
    link: 'https://www.coursera.org/learn/ruby-on-rails-intro'
    img: 'ruby-on-rails-intro.jpeg'
    certificate: 'https://coursera.org/share/5c53d949d1cfd0703509062e3a894df0'
    lecture-from: 'john_hopkins.png'

  - name: 'Single Page Web Applications with AngularJS'
    desc: 'Core design of AngularJS 1.x (latest version of AngularJS 1), its components and code organization techniques'
    link: 'https://www.coursera.org/learn/single-page-web-apps-with-angularjs'
    img: 'single-page-web-apps-with-angularjs.png'
    certificate: 'https://coursera.org/share/904d425c265a83adde09a3f1468b0f2b'
