{{ define "main" }}

<div class="container" role="main">
      <article role="main" class="blog-post">
        {{ .Content }}

        {{ if $.Param "socialShare" }}
            <hr/>
            <section id="social-share">
              <div class="list-inline footer-links">
                {{ partial "share-links" . }}
              </div>
            </section>
        {{ end }}

      </article>

</div>
{{ end }}
